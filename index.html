<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161d1a"><title>Iron Trench — Dieselpunk Arcade</title></head>
<body>
<main>
<header><div><div class="eyebrow">DIESELPUNK ARCADE · OPERATION 01</div><h1>IRON <span>TRENCH</span></h1></div><button id="sound" aria-pressed="false" type="button">♪ Sound off</button></header>
<section class="screen" aria-label="Dieselpunk arcade game screen">
<canvas id="game" width="960" height="440" aria-label="Side-scrolling trench and Iron Colossus boss"></canvas>
<div id="cover"><p class="eyebrow" id="kicker">FIELD BRIEFING / 01</p><h2 id="headline">Break the line.</h2><p id="brief">Reach the end of the trench and take down the Iron Colossus. Reflect incoming shells to turn its fire against it.</p><div class="brief-actions"><button id="start" type="button"><span id="action-label">Deploy</span><span aria-hidden="true">↗</span></button><div id="stage-picker" role="group" aria-label="Choose stage"><button type="button" data-stage="trench" aria-pressed="true">01 Trench</button><button type="button" data-stage="foundry" aria-pressed="false">02 Foundry</button></div></div></div>
</section>
<div class="touch" aria-label="Touch controls">
<div class="move"><button data-key="KeyA" aria-label="Move left">◀</button><button data-key="KeyW" aria-label="Aim up">▲</button><button data-key="KeyD" aria-label="Move right">▶</button><button data-key="KeyS" aria-label="Aim down">▼</button></div>
<div class="acts"><button data-key="Space">Jump</button><button data-key="KeyJ">Fire</button><button data-key="KeyK">Parry</button><button data-key="KeyL">Core</button><button data-key="KeyE">Mech</button></div>
</div>
<footer aria-label="Controls"><div><kbd>A</kbd><kbd>D</kbd> Move <kbd>W</kbd><kbd>S</kbd> Aim <kbd>Space</kbd> Jump</div><div><kbd>J</kbd> Fire <kbd>K</kbd> Parry <kbd>L</kbd> Toss empty core <kbd>E</kbd> Mount / eject</div></footer>
</main><script type="module" src="/src/main.ts"></script>
</body></html>
