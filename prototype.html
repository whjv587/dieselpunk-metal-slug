<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dieselpunk Metal Slug - Core Loop PoC</title>
  <style>
    body { margin: 0; background: #141210; color: #e8dcc5; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    canvas { border: 2px solid #8c6d46; background: #231f1b; box-shadow: 0 0 24px rgba(0,0,0,0.8); }
    .hud { margin-top: 10px; font-size: 13px; color: #b5a48b; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="420"></canvas>
  <div class="hud">Move: WASD / Arrows | Shoot (8-Way): J | Knife Parry: K | Toss Empty Gun Core: L</div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'k') triggerParry();
      if (e.key.toLowerCase() === 'l') tossJunkCore();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    const player = { x: 120, y: 310, w: 28, h: 42, vy: 0, grounded: true, facing: 1, ammo: 18, parryTimer: 0, shake: 0 };
    const bullets = [], enemyShells = [], cores = [], particles = [];
    const enemies = [{ x: 640, y: 300, w: 36, h: 52, hp: 12, cd: 90 }];
    let fireCd = 0;

    function spawnBurst(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 5;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 24, color });
      }
    }

    function triggerParry() {
      if (player.parryTimer > 0) return;
      player.parryTimer = 14;
      enemyShells.forEach(s => {
        if (Math.hypot(s.x - (player.x + 14), s.y - (player.y + 20)) < 58) {
          s.vx = -s.vx * 1.8; s.vy = -1.5; s.reflected = true;
          player.shake = 8;
          spawnBurst(s.x, s.y, '#7dffb3', 18);
        }
      });
    }

    function tossJunkCore() {
      if (player.ammo > 0) return;
      cores.push({ x: player.x + 14, y: player.y + 12, vx: player.facing * 8, vy: -5 });
      player.ammo = 18; // reload fresh sidearm/pickup
      spawnBurst(player.x + 14, player.y + 12, '#ff6b35', 10);
    }

    function update() {
      let dx = 0, dy = 0;
      if (keys['a'] || keys['arrowleft']) { dx = -1; player.facing = -1; }
      if (keys['d'] || keys['arrowright']) { dx = 1; player.facing = 1; }
      if (keys['w'] || keys['arrowup']) dy = -1;
      if (keys['s'] || keys['arrowdown']) dy = 1;

      player.x = Math.max(20, Math.min(750, player.x + dx * 4));
      if ((keys[' '] || keys['w']) && player.grounded) { player.vy = -10.5; player.grounded = false; }
      player.vy += 0.55; player.y += player.vy;
      if (player.y >= 310) { player.y = 310; player.vy = 0; player.grounded = true; }
      if (player.parryTimer > 0) player.parryTimer--;
      if (player.shake > 0) player.shake--;

      if (fireCd > 0) fireCd--;
      if (keys['j'] && fireCd === 0 && player.ammo > 0) {
        const ax = dx !== 0 ? dx : (dy !== 0 ? 0 : player.facing);
        const ay = dy;
        const len = Math.hypot(ax, ay) || 1;
        bullets.push({ x: player.x + 14, y: player.y + 18, vx: (ax / len) * 11, vy: (ay / len) * 11 });
        player.ammo--; fireCd = 7;
      }

      bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        enemies.forEach(e => {
          if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.hp--; bullets.splice(i, 1); spawnBurst(b.x, b.y, '#ffd166', 6);
          }
        });
      });

      cores.forEach((c, i) => {
        c.vy += 0.4; c.x += c.vx; c.y += c.vy;
        if (c.y >= 344) {
          player.shake = 12; spawnBurst(c.x, c.y, '#ff4d4d', 28);
          enemies.forEach(e => { if (Math.abs(e.x - c.x) < 120) e.hp -= 6; });
          cores.splice(i, 1);
        }
      });

      enemies.forEach(e => {
        if (e.hp <= 0) { e.hp = 12; e.x = 580 + Math.random() * 140; }
        if (--e.cd <= 0) {
          enemyShells.push({ x: e.x, y: e.y + 20, vx: -4.2, vy: -1.8, reflected: false });
          e.cd = 110;
        }
      });

      enemyShells.forEach((s, i) => {
        s.vy += 0.04; s.x += s.vx; s.y += s.vy;
        if (s.reflected) {
          enemies.forEach(e => {
            if (s.x > e.x && s.x < e.x + e.w) {
              e.hp -= 8; player.shake = 10; spawnBurst(s.x, s.y, '#7dffb3', 24); enemyShells.splice(i, 1);
            }
          });
        }
      });

      particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if (--p.life <= 0) particles.splice(i, 1); });
    }

    function draw() {
      ctx.save();
      if (player.shake > 0) ctx.translate((Math.random() - 0.5) * player.shake, (Math.random() - 0.5) * player.shake);
      ctx.clearRect(0, 0, 800, 420);
      ctx.fillStyle = '#3b332b'; ctx.fillRect(0, 352, 800, 68);

      // Player
      ctx.fillStyle = player.ammo === 0 ? '#ff595e' : '#4ea8de';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      if (player.parryTimer > 0) {
        ctx.strokeStyle = '#7dffb3'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x + 14, player.y + 20, 44, -0.8, 0.8); ctx.stroke();
      }

      // Enemies & Projectiles
      enemies.forEach(e => { ctx.fillStyle = '#8ac926'; ctx.fillRect(e.x, e.y, e.w, e.h); });
      ctx.fillStyle = '#ffca3a'; bullets.forEach(b => ctx.fillRect(b.x - 3, b.y - 3, 6, 6));
      enemyShells.forEach(s => { ctx.fillStyle = s.reflected ? '#7dffb3' : '#ff595e'; ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); });
      cores.forEach(c => { ctx.fillStyle = '#ff4d4d'; ctx.fillRect(c.x - 6, c.y - 6, 12, 12); });
      particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); });

      ctx.fillStyle = '#e8dcc5'; ctx.font = '14px monospace';
      ctx.fillText(player.ammo > 0 ? `AMMO: ${player.ammo}` : 'AMMO EMPTY! PRESS [L] TO TOSS VOLATILE JUNK CORE!', 20, 28);
      ctx.restore();
    }

    (function loop() { update(); draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
